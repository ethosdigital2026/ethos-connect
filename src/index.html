<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ethos Connect</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="expandida">
  <aside id="barra">
    <div class="marca" title="Ethos Connect"><img src="img/simbolo-branco.png" alt=""></div>
    <nav id="lista"></nav>
    <div class="rodape">
      <div class="zoom-ctrl">
        <button id="btn-zoom-menos" title="Diminuir zoom (Ctrl −)" aria-label="Diminuir zoom">−</button>
        <button id="zoom-nivel" title="Voltar para 100% (Ctrl 0)">100%</button>
        <button id="btn-zoom-mais" title="Aumentar zoom (Ctrl +)" aria-label="Aumentar zoom">+</button>
      </div>
      <button id="btn-notif" class="btn-barra" title="Notificações ligadas (clique para desligar)">
        <svg class="se-ligado" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <svg class="se-desligado" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-9.3-5M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M3 3l18 18"/></svg>
      </button>
      <button id="btn-discreto" class="btn-barra" title="Mostrar conteúdo nas notificações">
        <svg class="se-desligado" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="se-ligado" viewBox="0 0 24 24"><path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.1-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>
      </button>
      <button id="btn-cadeado" class="btn-barra" title="Bloquear agora" hidden>
        <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
      <button id="btn-ocultar" class="btn-barra" title="Esconder barra (Ctrl+Alt+B)">
        <svg viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
      <button id="btn-downloads" class="btn-barra" title="Downloads">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span id="selo-downloads" class="selo-mini" hidden></span>
      </button>
      <span class="divisor"></span>
      <button id="btn-adicionar" class="btn-barra" title="Adicionar serviço">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btn-config" class="btn-barra" title="Configurações">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </aside>

  <button id="faixa" title="Mostrar barra (Ctrl+Alt+B)" aria-label="Mostrar barra"></button>

  <main id="tela">
    <section id="abertura">
      <img src="img/simbolo-branco.png" alt="">
      <div class="nome">
        <span class="nome-ethos">Ethos</span>
        <span class="nome-connect">CONNECT</span>
      </div>
      <p id="abertura-msg" class="abertura-msg">Carregando serviços…</p>
    </section>

    <form id="dialogo" class="dialogo" hidden></form>

    <section id="bloqueio">
      <img src="img/simbolo-branco.png" alt="">
      <div class="nome">
        <span class="nome-ethos">Ethos</span>
        <span class="nome-connect">CONNECT</span>
      </div>

      <form id="form-pin" class="painel-pin" autocomplete="off">
        <label for="campo-pin">Digite seu PIN</label>
        <input id="campo-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn-pin">Desbloquear</button>
        <p id="pin-erro" class="pin-erro" aria-live="polite"></p>
        <button type="button" id="btn-esqueci" class="link-pin">Esqueci o PIN</button>
      </form>

      <div id="painel-esqueci" class="painel-pin" hidden>
        <p class="aviso-pin"><strong>Isso apaga tudo do Ethos Connect neste computador:</strong> desconecta os WhatsApps, o Gmail e os outros serviços e apaga as configurações e o PIN.</p>
        <p class="aviso-pin">O app vai fechar. Ao abrir de novo, é preciso conectar cada conta outra vez.</p>
        <button type="button" id="btn-apagar-tudo" class="btn-pin perigo">Apagar tudo e fechar</button>
        <button type="button" id="btn-voltar-pin" class="link-pin">Voltar</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
